name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neovim-embed-spike:
    name: Neovim embed spike
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: spikes/neovim-embed -> target

      - name: Install Neovim
        shell: powershell
        run: |
          choco install neovim -y --no-progress
          "C:\tools\neovim\nvim-win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show Neovim version
        shell: powershell
        run: nvim --version

      - name: Run Neovim embed spike
        run: cargo run --manifest-path spikes/neovim-embed/Cargo.toml

  neovim-ui-spike-build:
    name: Neovim UI spike build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: spikes/neovim-ui/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: spikes/neovim-ui
        run: npm install

      - name: Audit runtime dependencies
        working-directory: spikes/neovim-ui
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit all dependencies
        working-directory: spikes/neovim-ui
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Build frontend
        working-directory: spikes/neovim-ui
        run: npm run build

      - name: Build Windows executable
        run: cargo build --release --manifest-path spikes/neovim-ui/src-tauri/Cargo.toml

      - name: Upload Neovim UI spike
        uses: actions/upload-artifact@v7
        with:
          name: quire-neovim-ui-spike-windows
          if-no-files-found: error
          path: |
            spikes/neovim-ui/src-tauri/target/release/quire-neovim-ui-spike.exe
            spikes/neovim-ui/package-lock.json

  multi-webview-spike-build:
    name: Multi WebView spike build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: spikes/multi-webview/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: spikes/multi-webview
        run: npm install

      - name: Build frontend
        working-directory: spikes/multi-webview
        run: npm run build

      - name: Build Windows executable
        run: cargo build --release --manifest-path spikes/multi-webview/src-tauri/Cargo.toml

      - name: Upload Multi WebView spike
        uses: actions/upload-artifact@v7
        with:
          name: quire-multi-webview-spike-windows
          if-no-files-found: error
          path: |
            spikes/multi-webview/src-tauri/target/release/quire-multi-webview-spike.exe
            spikes/multi-webview/package-lock.json

  webview2-extensions-spike-build:
    name: WebView2 Extensions spike build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: spikes/webview2-extensions/src-tauri -> target

      - name: Build Windows executable
        run: cargo build --release --manifest-path spikes/webview2-extensions/src-tauri/Cargo.toml

      - name: Upload WebView2 Extensions spike
        uses: actions/upload-artifact@v7
        with:
          name: quire-webview2-extensions-spike-windows
          if-no-files-found: error
          path: spikes/webview2-extensions/src-tauri/target/release/quire-webview2-extensions-spike.exe

  git-snapshot-isolation-spike:
    name: Git snapshot isolation spike
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: spikes/git-snapshot-isolation -> target

      - name: Run Git snapshot isolation spike
        run: cargo run --release --manifest-path spikes/git-snapshot-isolation/Cargo.toml
