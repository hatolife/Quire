name: Desktop CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    name: Quire desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Quire workspace
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: . -> target

      - name: Test quire-core
        run: cargo test -p quire-core

      - name: Install desktop frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Quire desktop executable
        working-directory: apps/desktop
        run: npm run tauri build -- --no-bundle

      - name: Assemble Quire desktop package
        shell: powershell
        run: |
          $package = "dist\quire-desktop-windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target\release\quire-desktop.exe" "$package\Quire.exe"

      - name: Set Quire desktop package name
        id: package
        shell: powershell
        run: |
          $jst = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "Tokyo Standard Time")
          $timestamp = $jst.ToString("yyyyMMddHHmmss")
          $hash = $env:GITHUB_SHA.Substring(0, 7)
          "name=quire-desktop-windows-v0.0.1.$timestamp.$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Quire desktop
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          path: dist/quire-desktop-windows
